<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Codex Music — Phase 6: Search Preview</title>
<style>
  :root {
    --background: #0A0A0F;
    --surface: #12121A;
    --surfaceElevated: #1A1A24;
    --border: #26263380;
    --primary: #8B5CF6;
    --accent: #3B82F6;
    --muted: #8A8A9A;
    --gradient: linear-gradient(135deg, #8B5CF6 0%, #3B82F6 100%);
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--background);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Inter, Arial, sans-serif;
  }
  body { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }

  .app { display: flex; height: 100vh; }

  /* ---- Sidebar ---- */
  .sidebar {
    width: 240px; flex-shrink: 0; border-right: 1px solid var(--border);
    padding: 20px 14px; display: flex; flex-direction: column; gap: 22px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 0 8px; }
  .brand .logo {
    width: 30px; height: 30px; border-radius: 9px; background: var(--gradient);
    display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 14px;
  }
  .brand span { font-weight: 700; letter-spacing: -0.02em; }
  .nav { display: flex; flex-direction: column; gap: 2px; }
  .nav a {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px;
    color: var(--muted); text-decoration: none; font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .nav a.active { background: var(--surfaceElevated); color: #fff; }
  .nav a:hover { color: #fff; }
  .nav svg { width: 18px; height: 18px; flex-shrink: 0; }
  .sidebar-hint {
    margin-top: auto; font-size: 11px; color: var(--muted); padding: 10px 12px;
    border: 1px dashed var(--border); border-radius: 10px; line-height: 1.5;
  }
  .kbd { display: inline-flex; align-items: center; border: 1px solid var(--border); background: var(--surfaceElevated);
    border-radius: 6px; padding: 1px 6px; font-size: 10px; font-family: inherit; }

  /* ---- Main ---- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    height: 64px; flex-shrink: 0; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 16px; padding: 0 20px;
  }
  .search-trigger {
    flex: 1; max-width: 420px; display: flex; align-items: center; gap: 10px;
    background: var(--surface); border: 1px solid var(--border); border-radius: 999px;
    padding: 10px 14px; color: var(--muted); cursor: pointer; font-size: 14px; transition: border-color .15s, color .15s;
  }
  .search-trigger:hover { border-color: #8B5CF680; color: #fff; }
  .search-trigger svg { width: 16px; height: 16px; flex-shrink: 0; }
  .search-trigger .kbd { margin-left: auto; }

  .content { flex: 1; overflow-y: auto; padding: 28px 32px; max-width: 980px; width: 100%; margin: 0 auto; }
  h1 { font-size: 28px; margin: 0 0 4px; }
  .muted { color: var(--muted); }

  .page-search-box { position: relative; margin-bottom: 22px; }
  .page-search-box svg.icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); }
  .page-search-box input {
    width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 16px;
    padding: 14px 16px 14px 44px; font-size: 15px; color: #fff; outline: none;
  }
  .page-search-box input:focus { border-color: var(--primary); }

  .recent-row { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 24px; }
  .chip {
    border: 1px solid var(--border); border-radius: 999px; padding: 7px 14px; font-size: 13px;
    color: #fff; cursor: pointer; background: transparent;
  }
  .chip:hover { border-color: var(--primary); }

  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--border); margin-bottom: 18px; }
  .tab {
    padding: 10px 16px; font-size: 14px; font-weight: 500; color: var(--muted); cursor: pointer;
    border-bottom: 2px solid transparent; background: none; border-top: none; border-left: none; border-right: none;
  }
  .tab.active { color: #fff; border-bottom-color: var(--primary); }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 14px; }
  .card { border-radius: 12px; padding: 8px; cursor: pointer; transition: background .15s; }
  .card:hover { background: var(--surface); }
  .cover {
    aspect-ratio: 1; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 30px; color: #fff; margin-bottom: 10px; overflow: hidden;
  }
  .cover.round { border-radius: 999px; }
  .card .title { font-size: 13.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .subtitle { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .song-row { display: flex; align-items: center; gap: 12px; padding: 8px 10px; border-radius: 10px; cursor: pointer; }
  .song-row:hover { background: var(--surface); }
  .song-row .cover { width: 42px; height: 42px; margin: 0; font-size: 15px; flex-shrink: 0; }
  .song-row .meta { min-width: 0; flex: 1; }
  .song-row .meta .t { font-size: 14px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-row .meta .a { font-size: 12.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .song-row .dur { font-size: 12.5px; color: var(--muted); flex-shrink: 0; }

  .empty { text-align: center; padding: 70px 20px; border: 1px dashed var(--border); border-radius: 18px; }
  .empty h3 { margin: 0 0 6px; }

  /* ---- Command palette ---- */
  .overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.6); display: none;
    align-items: flex-start; justify-content: center; padding: 12vh 16px 16px; z-index: 100;
  }
  .overlay.open { display: flex; }
  .palette {
    width: 100%; max-width: 560px; max-height: 70vh; display: flex; flex-direction: column;
    background: var(--surface); border: 1px solid var(--border); border-radius: 18px;
    box-shadow: 0 30px 80px rgba(0,0,0,.5); overflow: hidden;
  }
  .palette-input { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .palette-input svg { width: 18px; height: 18px; color: var(--muted); flex-shrink: 0; }
  .palette-input input { flex: 1; background: none; border: none; outline: none; color: #fff; font-size: 14.5px; min-width: 0; }
  .palette-input input::placeholder { color: #8A8A9AB0; }
  .palette-close { color: var(--muted); background: none; border: none; cursor: pointer; padding: 4px; border-radius: 999px; display:flex; }
  .palette-close:hover { background: var(--surfaceElevated); color: #fff; }
  .palette-body { flex: 1; overflow-y: auto; padding: 8px; }
  .group-label { display: flex; align-items: center; gap: 7px; padding: 8px 12px 6px; font-size: 12px; font-weight: 600; color: var(--muted); }
  .group-label svg { width: 14px; height: 14px; }
  .row {
    display: flex; align-items: center; gap: 12px; padding: 8px 12px; border-radius: 10px; cursor: pointer;
  }
  .row:hover, .row.active { background: var(--surfaceElevated); }
  .row .cover { width: 36px; height: 36px; margin: 0; font-size: 13px; flex-shrink: 0; }
  .row .rt { min-width: 0; }
  .row .rt .t { font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .row .rt .s { font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .view-all { display: block; width: 100%; text-align: left; padding: 11px 14px; border-radius: 10px; color: var(--primary);
    background: none; border: none; font-size: 13.5px; cursor: pointer; margin-top: 4px; }
  .view-all:hover, .view-all.active { background: var(--surfaceElevated); }
  .palette-empty { text-align: center; padding: 40px 20px; color: var(--muted); font-size: 13.5px; }
  .palette-empty strong { display: block; color: #fff; font-size: 14.5px; margin-bottom: 4px; }

  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px);
    background: var(--surfaceElevated); border: 1px solid var(--border); border-radius: 12px;
    padding: 10px 18px; font-size: 13.5px; opacity: 0; transition: all .25s; pointer-events: none; z-index: 200;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }
</style>
</head>
<body>

<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">C</div>
      <span>Codex Music</span>
    </div>
    <nav class="nav">
      <a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12l9-9 9 9M5 10v10h14V10"/></svg>
        Home
      </a>
      <a class="active">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        Search
      </a>
      <a>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M3 12h18M3 18h18"/></svg>
        Library
      </a>
    </nav>
    <div class="sidebar-hint">Phase 6 preview — try <span class="kbd">⌘K</span> / <span class="kbd">Ctrl K</span> anywhere, or click the search bar.</div>
  </aside>

  <div class="main">
    <div class="topbar">
      <button class="search-trigger" id="openPaletteBtn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <span>Search songs, artists, albums, playlists…</span>
        <span class="kbd">⌘K</span>
      </button>
    </div>

    <div class="content">
      <div class="page-search-box">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="pageInput" placeholder="Search songs, artists, albums, playlists…" />
      </div>

      <div id="pageRecent" class="recent-row"></div>

      <div id="pageEmptyState"></div>

      <div id="pageResults" style="display:none">
        <div class="tabs" id="tabs"></div>
        <div id="tabContent"></div>
      </div>
    </div>
  </div>
</div>

<!-- Command palette -->
<div class="overlay" id="overlay">
  <div class="palette">
    <div class="palette-input">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="paletteInput" placeholder="Search songs, artists, albums, playlists…" autocomplete="off" />
      <button class="palette-close" id="closePaletteBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6L6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="palette-body" id="paletteBody"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ---------------------------------------------------------------------
// Mock catalog — stands in for GET /search from SearchService in the
// real app. Same ranking idea (best of trigram similarity / full-text
// match, ties broken by playCount) reimplemented client-side in JS
// purely so this preview has zero backend dependency.
// ---------------------------------------------------------------------
const SONGS = [
  { id: "s1", title: "Neon Skyline", artist: "Wave Runner", album: "Night Drive", duration: "3:24", playCount: 981234, color: "#8B5CF6" },
  { id: "s2", title: "Glass Horizon", artist: "Wave Runner", album: "Night Drive", duration: "4:01", playCount: 542211, color: "#3B82F6" },
  { id: "s3", title: "Paper Moon", artist: "Lena Cole", album: "Lighthouse", duration: "2:58", playCount: 1203044, color: "#FF6A3D" },
  { id: "s4", title: "Static Bloom", artist: "Halide", album: "Static Bloom EP", duration: "3:47", playCount: 88213, color: "#3B82F6" },
  { id: "s5", title: "Velvet Static", artist: "Halide", album: "Static Bloom EP", duration: "3:12", playCount: 44120, color: "#8B5CF6" },
  { id: "s6", title: "Amber Tide", artist: "Lena Cole", album: "Lighthouse", duration: "3:33", playCount: 671009, color: "#FF6A3D" },
  { id: "s7", title: "Slow Static", artist: "Moonside", album: "Afterglow", duration: "4:20", playCount: 20938, color: "#3B82F6" },
];
const ARTISTS = [
  { id: "a1", name: "Wave Runner", color: "#8B5CF6" },
  { id: "a2", name: "Lena Cole", color: "#FF6A3D" },
  { id: "a3", name: "Halide", color: "#3B82F6" },
  { id: "a4", name: "Moonside", color: "#8B5CF6" },
];
const ALBUMS = [
  { id: "al1", title: "Night Drive", artist: "Wave Runner", color: "#8B5CF6" },
  { id: "al2", title: "Lighthouse", artist: "Lena Cole", color: "#FF6A3D" },
  { id: "al3", title: "Static Bloom EP", artist: "Halide", color: "#3B82F6" },
  { id: "al4", title: "Afterglow", artist: "Moonside", color: "#8B5CF6" },
];
const PLAYLISTS = [
  { id: "p1", title: "Late Night Drive", owner: "codexradio", color: "#3B82F6" },
  { id: "p2", title: "Static & Sunsets", owner: "lena.fm", color: "#FF6A3D" },
  { id: "p3", title: "Afterglow Mix", owner: "moonside_official", color: "#8B5CF6" },
];

const iconSearch = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>';
const iconMusic = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/></svg>';
const iconMic = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0014 0M12 19v3"/></svg>';
const iconDisc = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="2.5"/></svg>';
const iconList = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>';
const iconClock = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>';

function initial(s) { return (s || "?").trim()[0]?.toUpperCase() ?? "?"; }
function cover(color, text, round) {
  return `<div class="cover${round ? " round" : ""}" style="background:${color}">${initial(text)}</div>`;
}

// Trigram-ish scoring stand-in: substring match scores highest, then
// shared-character overlap approximates what similarity()/ts_rank would
// do server-side. Good enough for a static demo, not meant to be real.
function score(text, q) {
  text = text.toLowerCase(); q = q.toLowerCase();
  if (!q) return 0;
  if (text.includes(q)) return 100 - text.indexOf(q);
  let overlap = 0;
  for (const ch of new Set(q)) if (text.includes(ch)) overlap++;
  return (overlap / q.length) * 40;
}

function search(q, limit) {
  const rank = (items, keyFn, popFn) =>
    items
      .map((it) => ({ it, sc: score(keyFn(it), q) }))
      .filter((x) => x.sc > 15)
      .sort((x, y) => y.sc - x.sc || (popFn(y.it) || 0) - (popFn(x.it) || 0))
      .slice(0, limit)
      .map((x) => x.it);

  return {
    songs: rank(SONGS, (s) => s.title, (s) => s.playCount),
    artists: rank(ARTISTS, (a) => a.name),
    albums: rank(ALBUMS, (a) => a.title),
    playlists: rank(PLAYLISTS, (p) => p.title),
  };
}

// ---------------------------------------------------------------------
// Recent searches — localStorage, mirrors lib/recent-searches.ts
// ---------------------------------------------------------------------
const RECENT_KEY = "codex-music-preview:recent-searches";
function getRecent() { try { return JSON.parse(localStorage.getItem(RECENT_KEY) || "[]"); } catch { return []; } }
function addRecent(q) {
  q = q.trim(); if (!q) return;
  const next = [q, ...getRecent().filter((x) => x.toLowerCase() !== q.toLowerCase())].slice(0, 8);
  localStorage.setItem(RECENT_KEY, JSON.stringify(next));
}
function clearRecent() { localStorage.removeItem(RECENT_KEY); }

function toast(msg) {
  const el = document.getElementById("toast");
  el.textContent = msg;
  el.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => el.classList.remove("show"), 1600);
}

// ---------------------------------------------------------------------
// Command palette
// ---------------------------------------------------------------------
const overlay = document.getElementById("overlay");
const paletteInput = document.getElementById("paletteInput");
const paletteBody = document.getElementById("paletteBody");
let paletteItems = [];
let paletteActive = 0;
let paletteDebounce = null;

function openPalette() {
  overlay.classList.add("open");
  paletteInput.value = "";
  renderPalette("");
  setTimeout(() => paletteInput.focus(), 10);
}
function closePalette() { overlay.classList.remove("open"); }

function renderPalette(q) {
  paletteActive = 0;
  const trimmed = q.trim();

  if (!trimmed) {
    const recent = getRecent();
    paletteItems = recent.map((r) => ({ type: "recent", value: r }));
    paletteBody.innerHTML = recent.length
      ? `<div class="group-label">${iconClock}Recent searches</div>` +
        recent.map((r, i) => rowHtml(i, iconClock, "", r, "", false)).join("")
      : `<div class="palette-empty">Search for songs, artists, albums or playlists</div>`;
    wireRows();
    return;
  }

  const results = search(trimmed, 5);
  const groups = [
    { label: "Songs", icon: iconMusic, entries: results.songs.map((s) => ({ type: "song", data: s })) },
    { label: "Artists", icon: iconMic, entries: results.artists.map((a) => ({ type: "artist", data: a })) },
    { label: "Albums", icon: iconDisc, entries: results.albums.map((a) => ({ type: "album", data: a })) },
    { label: "Playlists", icon: iconList, entries: results.playlists.map((p) => ({ type: "playlist", data: p })) },
  ].filter((g) => g.entries.length);

  paletteItems = groups.flatMap((g) => g.entries);
  const hasResults = paletteItems.length > 0;
  if (hasResults) paletteItems.push({ type: "viewAll", value: trimmed });

  if (!hasResults) {
    paletteBody.innerHTML = `<div class="palette-empty"><strong>No results</strong>Try different keywords or check your spelling.</div>`;
    wireRows();
    return;
  }

  let i = -1;
  paletteBody.innerHTML = groups
    .map((g) => {
      const rows = g.entries
        .map((e) => {
          i++;
          const d = e.data;
          if (e.type === "song") return rowHtml(i, "", cover(d.color, d.title), d.title, d.artist);
          if (e.type === "artist") return rowHtml(i, "", cover(d.color, d.name, true), d.name, "");
          if (e.type === "album") return rowHtml(i, "", cover(d.color, d.title), d.title, d.artist);
          return rowHtml(i, "", cover(d.color, d.title), d.title, "By " + d.owner);
        })
        .join("");
      return `<div class="group-label">${g.icon}${g.label}</div>${rows}`;
    })
    .join("") + `<button class="view-all" id="viewAllRow">View all results for "${escapeHtml(trimmed)}"</button>`;

  i++; // account for viewAll's index matching paletteItems length - 1
  wireRows();
  document.getElementById("viewAllRow").addEventListener("click", () => selectPaletteItem(paletteItems.length - 1));
  document.getElementById("viewAllRow").addEventListener("mouseenter", () => setPaletteActive(paletteItems.length - 1));
}

function rowHtml(index, iconSvg, coverHtml, title, subtitle) {
  return `<div class="row" data-idx="${index}">
    <span style="width:36px;height:36px;flex-shrink:0;border-radius:8px;overflow:hidden;display:flex;align-items:center;justify-content:center;background:var(--surfaceElevated)">
      ${coverHtml || `<span style="color:var(--muted)">${iconSvg}</span>`}
    </span>
    <span class="rt"><span class="t">${escapeHtml(title)}</span>${subtitle ? `<span class="s">${escapeHtml(subtitle)}</span>` : ""}</span>
  </div>`;
}

function wireRows() {
  paletteBody.querySelectorAll(".row[data-idx]").forEach((el) => {
    const idx = Number(el.dataset.idx);
    el.addEventListener("click", () => selectPaletteItem(idx));
    el.addEventListener("mouseenter", () => setPaletteActive(idx));
  });
  updatePaletteActive();
}

function setPaletteActive(idx) { paletteActive = idx; updatePaletteActive(); }
function updatePaletteActive() {
  paletteBody.querySelectorAll(".row, .view-all").forEach((el) => el.classList.remove("active"));
  const rows = [...paletteBody.querySelectorAll(".row")];
  if (rows[paletteActive]) rows[paletteActive].classList.add("active");
  const viewAll = document.getElementById("viewAllRow");
  if (viewAll && paletteActive === paletteItems.length - 1) viewAll.classList.add("active");
}

function selectPaletteItem(idx) {
  const item = paletteItems[idx];
  if (!item) return;
  addRecent(paletteInput.value);
  if (item.type === "recent") { paletteInput.value = item.value; renderPalette(item.value); paletteInput.focus(); return; }
  if (item.type === "viewAll") { closePalette(); openSearchPage(item.value); return; }
  closePalette();
  const label = item.type === "song" ? `Playing "${item.data.title}"` : `Opening ${item.data.title || item.data.name}`;
  toast(label);
}

paletteInput.addEventListener("input", () => {
  clearTimeout(paletteDebounce);
  const val = paletteInput.value;
  // 250ms debounce — matches useDebounce(query, 250) in the real app,
  // so this preview fires the same number of "searches" per keystroke burst.
  paletteDebounce = setTimeout(() => renderPalette(val), 250);
});
paletteInput.addEventListener("keydown", (e) => {
  if (e.key === "ArrowDown") { e.preventDefault(); paletteActive = Math.min(paletteActive + 1, paletteItems.length - 1); updatePaletteActive(); }
  else if (e.key === "ArrowUp") { e.preventDefault(); paletteActive = Math.max(paletteActive - 1, 0); updatePaletteActive(); }
  else if (e.key === "Enter") { e.preventDefault(); selectPaletteItem(paletteActive); }
});

document.getElementById("openPaletteBtn").addEventListener("click", openPalette);
document.getElementById("closePaletteBtn").addEventListener("click", closePalette);
overlay.addEventListener("click", (e) => { if (e.target === overlay) closePalette(); });
document.addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); }
  else if (e.key === "Escape" && overlay.classList.contains("open")) closePalette();
});

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

// ---------------------------------------------------------------------
// Full /search page
// ---------------------------------------------------------------------
const pageInput = document.getElementById("pageInput");
const pageRecent = document.getElementById("pageRecent");
const pageEmptyState = document.getElementById("pageEmptyState");
const pageResults = document.getElementById("pageResults");
const tabsEl = document.getElementById("tabs");
const tabContent = document.getElementById("tabContent");
const TABS = ["Songs", "Artists", "Albums", "Playlists"];
let activeTab = "Songs";
let pageDebounce = null;

function openSearchPage(q) {
  pageInput.value = q;
  renderRecentRow();
  renderPageFor(q);
}

function renderRecentRow() {
  const recent = getRecent();
  pageRecent.innerHTML = recent.length
    ? recent.map((r) => `<button class="chip" data-q="${escapeHtml(r)}">${escapeHtml(r)}</button>`).join("") +
      `<button class="chip" id="clearRecentChip" style="color:var(--muted)">Clear</button>`
    : "";
  pageRecent.querySelectorAll(".chip[data-q]").forEach((el) =>
    el.addEventListener("click", () => { pageInput.value = el.dataset.q; renderPageFor(el.dataset.q); pageInput.focus(); })
  );
  const clearBtn = document.getElementById("clearRecentChip");
  if (clearBtn) clearBtn.addEventListener("click", () => { clearRecent(); renderRecentRow(); });
}

function renderPageFor(q) {
  const trimmed = q.trim();
  renderRecentRow();

  if (!trimmed) {
    pageEmptyState.style.display = "";
    pageEmptyState.innerHTML = `<div class="empty"><h3>Search your world of music</h3><p class="muted">Look up songs, artists, albums or playlists by name.</p></div>`;
    pageResults.style.display = "none";
    return;
  }

  addRecent(trimmed);
  pageEmptyState.style.display = "none";
  pageResults.style.display = "";
  renderTabs();
  renderTabContent(trimmed);
}

function renderTabs() {
  tabsEl.innerHTML = TABS.map((t) => `<button class="tab${t === activeTab ? " active" : ""}" data-tab="${t}">${t}</button>`).join("");
  tabsEl.querySelectorAll(".tab").forEach((el) =>
    el.addEventListener("click", () => { activeTab = el.dataset.tab; renderTabs(); renderTabContent(pageInput.value.trim()); })
  );
}

function renderTabContent(q) {
  const results = search(q, 20);
  const map = { Songs: results.songs, Artists: results.artists, Albums: results.albums, Playlists: results.playlists };
  const items = map[activeTab];

  if (!items.length) {
    tabContent.innerHTML = `<div class="empty"><h3>No results</h3><p class="muted">Nothing matched "${escapeHtml(q)}" — try different keywords or check your spelling.</p></div>`;
    return;
  }

  if (activeTab === "Songs") {
    tabContent.innerHTML = `<div>${items
      .map(
        (s) => `<div class="song-row" data-toast="Playing &quot;${escapeHtml(s.title)}&quot;">
          ${cover(s.color, s.title)}
          <span class="meta"><span class="t">${escapeHtml(s.title)}</span><span class="a">${escapeHtml(s.artist)}</span></span>
          <span class="dur">${s.duration}</span>
        </div>`
      )
      .join("")}</div>`;
  } else {
    tabContent.innerHTML = `<div class="grid">${items
      .map((it) => {
        const round = activeTab === "Artists";
        const title = it.title || it.name;
        const subtitle = activeTab === "Albums" ? it.artist : activeTab === "Playlists" ? "By " + it.owner : "";
        return `<div class="card" data-toast="Opening ${escapeHtml(title)}">
          ${cover(it.color, title, round)}
          <div class="title">${escapeHtml(title)}</div>
          ${subtitle ? `<div class="subtitle">${escapeHtml(subtitle)}</div>` : ""}
        </div>`;
      })
      .join("")}</div>`;
  }

  tabContent.querySelectorAll("[data-toast]").forEach((el) => el.addEventListener("click", () => toast(el.dataset.toast)));
}

pageInput.addEventListener("input", () => {
  clearTimeout(pageDebounce);
  const val = pageInput.value;
  pageDebounce = setTimeout(() => renderPageFor(val), 250);
});

// Initial state
renderRecentRow();
renderPageFor("");
</script>
</body>
</html>
