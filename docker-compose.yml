version: "3.9"

name: codex-music

services:
  postgres:
    image: postgres:16-alpine
    container_name: codex-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-codex}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-codex_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-codex_music}
    ports:
      - "5432:5432"
    volumes:
      - codex_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-codex}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codex-network

  redis:
    image: redis:7-alpine
    container_name: codex-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - codex_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codex-network

  minio:
    # Pinned instead of `:latest` — an unpinned tag means `docker compose
    # pull`/a fresh `up` can silently change the running MinIO version
    # (and its behavior) with no corresponding change in this repo. This
    # specific tag is a real MinIO release tag, not a placeholder — but it
    # was chosen from training-data knowledge with no live registry access
    # to confirm it's still current or unaffected by any CVE published
    # since. Before relying on this in anything beyond local dev, verify
    # against https://github.com/minio/minio/releases (or better, resolve
    # it to an immutable `minio/minio@sha256:...` digest) from a machine
    # with internet access, and update `minio-init`'s `minio/mc` tag below
    # to match the same release date.
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: codex-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${STORAGE_ACCESS_KEY:-codex_minio}
      MINIO_ROOT_PASSWORD: ${STORAGE_SECRET_KEY:-codex_minio_secret}
      # Phase 8: offline downloads (see apps/web/src/lib/offline-store.ts)
      # read audio bytes with `fetch()` to store them in IndexedDB, which
      # — unlike an <audio src> tag — requires the response to carry
      # CORS headers naming the web app's origin. Streaming playback
      # itself doesn't need this.
      MINIO_API_CORS_ALLOW_ORIGIN: ${WEB_APP_URL:-http://localhost:3000}
    ports:
      - "9000:9000" # S3 API
      - "9001:9001" # Web console
    volumes:
      - codex_minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - codex-network

  # One-shot job: creates the bucket and sets it public-read so uploaded
  # audio/cover/avatar files are fetchable by URL, same as they'd be
  # behind a CDN in front of real S3. Runs once per `docker compose up`
  # and exits — safe to re-run, `mc mb --ignore-existing` is idempotent.
  minio-init:
    # Kept in step with the `minio` service's release date above — see its
    # comment for why this isn't `:latest` and what to check before
    # trusting this exact tag long-term.
    image: minio/mc:RELEASE.2024-01-16T16-06-34Z
    container_name: codex-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${STORAGE_ACCESS_KEY:-codex_minio} ${STORAGE_SECRET_KEY:-codex_minio_secret} &&
      mc mb --ignore-existing local/${STORAGE_BUCKET:-codex-music} &&
      mc anonymous set download local/${STORAGE_BUCKET:-codex-music}
      "
    networks:
      - codex-network

  api:
    build:
      context: .
      dockerfile: infra/docker/api.Dockerfile
    container_name: codex-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codex}:${POSTGRES_PASSWORD:-codex_dev_password}@postgres:5432/${POSTGRES_DB:-codex_music}?schema=public
      REDIS_URL: redis://redis:6379
      PORT: 4000
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - codex-network

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
      args:
        # Public env vars are inlined at build time. Local Docker dev talks to
        # the API on its published port; production (docker-compose.prod.yml)
        # passes an empty value for same-origin requests.
        NEXT_PUBLIC_API_URL: http://localhost:4000
    container_name: codex-web
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - api
    networks:
      - codex-network

  # Consumes the `audio-transcode` BullMQ queue (see
  # apps/api/src/storage/storage.service.ts#transcodeAudio and
  # apps/api/src/queue/workers/audio-transcode.worker.ts): downloads a
  # song's original uploaded audio, transcodes it into a 128k/192k/320k
  # HLS playlist with ffmpeg, and uploads the result back into the same
  # bucket. Built from its own ffmpeg-capable image (infra/docker/worker.Dockerfile)
  # so ffmpeg never has to live in the `api` container. Entirely optional
  # in the sense that the product works without it — if this container is
  # down, jobs simply queue up in Redis and every song keeps playing from
  # its direct `audioUrl` until the worker comes back.
  transcode-worker:
    build:
      context: .
      dockerfile: infra/docker/worker.Dockerfile
    container_name: codex-transcode-worker
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-codex}:${POSTGRES_PASSWORD:-codex_dev_password}@postgres:5432/${POSTGRES_DB:-codex_music}?schema=public
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    networks:
      - codex-network

  # Phase 8/9 skeleton (see services/ai/README.md) — /health + /recommend
  # only, and /recommend is a thin proxy to the API's real content-based
  # RecommendationsService below, not a model. Wired in here (Phase 10
  # "next step" #4 — done) so `docker compose up` starts it alongside
  # everything else; nothing else in the stack calls it yet, so removing
  # this block wouldn't break any other service.
  ai:
    build:
      context: .
      dockerfile: services/ai/Dockerfile
    container_name: codex-ai
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Container-network hostname, not localhost: this service calls
      # the `api` container directly, same global "/api" prefix as
      # every other client (see apps/api/src/main.ts's setGlobalPrefix).
      CODEX_API_URL: http://api:4000/api
    ports:
      - "8000:8000"
    depends_on:
      - api
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - codex-network

networks:
  codex-network:
    driver: bridge

volumes:
  codex_postgres_data:
  codex_redis_data:
  codex_minio_data:
