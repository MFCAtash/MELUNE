version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    groups:
      nest: { patterns: ["@nestjs/*"] }
      prisma: { patterns: ["prisma", "@prisma/*"] }
      next-react: { patterns: ["next", "eslint-config-next", "react", "react-dom", "@types/react*"] }
      testing: { patterns: ["vitest", "jest", "ts-jest", "@types/jest", "@testing-library/*", "@playwright/test"] }
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: "/infra/docker"
    schedule: { interval: weekly }
