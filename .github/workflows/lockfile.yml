name: Generate lockfile

# One-click fix for a missing/out-of-sync package-lock.json.
# Run from the Actions tab: "Generate lockfile" → Run workflow.
# GitHub runners have registry access; the offline sandbox this repo was
# authored in did not, which is why the lockfile was never committed.

on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Generate package-lock.json
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify (structure + npm accepts it)
        run: |
          node scripts/check-lockfile.mjs
          npm ci --dry-run --ignore-scripts

      - name: Upload artifact (always available as a fallback)
        uses: actions/upload-artifact@v4
        with:
          name: package-lock
          path: package-lock.json
          retention-days: 30

      - name: Commit to a branch and open a PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- package-lock.json && git ls-files --error-unmatch package-lock.json >/dev/null 2>&1; then
            echo "Lockfile already up to date — nothing to commit."
            exit 0
          fi
          branch="chore/package-lock-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add package-lock.json
          git commit -m "chore: add/refresh package-lock.json"
          git push origin "$branch"
          gh pr create --base "${{ github.event.repository.default_branch }}" --head "$branch" \
            --title "chore: add/refresh package-lock.json" \
            --body "Generated by the Generate lockfile workflow. Note: PRs opened with GITHUB_TOKEN do not trigger CI automatically — close and reopen this PR (or push an empty commit) to run the pipeline." \
            || echo "::warning::Could not open a PR (enable Settings → Actions → 'Allow GitHub Actions to create pull requests'). Branch $branch was pushed; open the PR manually, or download the artifact."
