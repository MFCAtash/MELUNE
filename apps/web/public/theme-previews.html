<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<title>MELUNE — Theme Concepts</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 48px 40px 80px;
    background: #05060A;
    color: #fff;
    font-family: "Segoe UI", Tahoma, sans-serif;
  }
  h1 { font-size: 30px; margin: 0 0 4px; letter-spacing: .5px; }
  .sub { color: #9aa3b2; font-size: 14px; margin-bottom: 34px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(360px, 1fr));
    gap: 26px;
  }
  .card {
    position: relative; border-radius: 22px; padding: 20px;
    overflow: hidden; border: 1px solid rgba(255,255,255,.08);
  }
  .card .halo-bg {
    position: absolute; inset: -40% -20% auto; height: 70%;
    filter: blur(60px); opacity: .8; pointer-events: none;
  }
  .head { position: relative; display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
  .name { font-size: 18px; font-weight: 700; }
  .mood { font-size: 11.5px; opacity: .65; margin-top: 3px; }
  .badge {
    font-size: 10px; padding: 4px 9px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,.16); opacity: .8; white-space: nowrap;
  }
  .app {
    position: relative; margin-top: 18px; border-radius: 16px; padding: 14px;
    display: flex; gap: 14px; align-items: center;
  }
  .art {
    position: relative; width: 74px; height: 74px; border-radius: 14px; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-size: 26px; font-weight: 800;
  }
  .art::before {
    content: ""; position: absolute; inset: -12px; border-radius: 22px;
    filter: blur(18px); z-index: -1;
  }
  .meta { flex: 1; min-width: 0; }
  .t1 { font-size: 14px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t2 { font-size: 11.5px; opacity: .6; margin-top: 2px; }
  .bar { margin-top: 10px; height: 4px; border-radius: 4px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 62%; border-radius: 4px; }
  .play {
    width: 40px; height: 40px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
  }
  .play svg { width: 15px; height: 15px; margin-right: -1px; }
  .swatches { display: flex; gap: 8px; margin-top: 16px; }
  .sw { flex: 1; border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,.09); }
  .sw i { display: block; height: 30px; }
  .sw span { display: block; font-size: 8.5px; padding: 4px 3px; text-align: center; opacity: .7; letter-spacing: .2px; }
  .halo-note { margin-top: 13px; font-size: 11px; opacity: .72; display: flex; align-items: center; gap: 7px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; flex: none; }
  .foot { margin-top: 38px; font-size: 12px; color: #7b8497; }
</style>
</head>
<body>
<h1>MELUNE · ۱۲ تم پیشنهادی</h1>
<div class="sub">پالت رنگ + هاله‌ی نور + حال‌وهوای هر تم — یک نگاه، بعد انتخاب</div>
<div class="grid" id="grid"></div>
<div class="foot">همه تم‌ها روی همان پلیر و صفحه‌های فعلی MELUNE پیاده می‌شوند؛ هاله‌ها با انیمیشن نرم و قابل خاموش‌کردن.</div>

<script>
const themes = [
  { name:"Aurora Noir", fa:"شفق قطبی", mood:"سینمایی · عمیق · آینده‌نگر", mode:"DARK",
    bg:"#070B1A", surface:"#0E1530", primary:"#7C5CFF", secondary:"#22D3EE", accent:"#F472B6", text:"#F5F7FF", muted:"#8B93B5",
    halo:"rgba(124,92,255,.55), rgba(34,211,238,.32)",
    note:"هاله‌ی شفق قطبی: موج آرام بنفش↔فیروزه‌ای پشت کاور و دکمه پلی" },
  { name:"Neon Tokyo", fa:"نئون توکیو", mood:"پر انرژی · شبانه · سایبرپانک", mode:"DARK",
    bg:"#05060A", surface:"#0C0F18", primary:"#FF2E97", secondary:"#00E5FF", accent:"#B026FF", text:"#F7F8FF", muted:"#8C90A8",
    halo:"rgba(255,46,151,.55), rgba(0,229,255,.35)",
    note:"رینگ نئونی: هاله‌ی دولایه دور کاور + خطوط اسکن ظریف" },
  { name:"Golden Hour", fa:"ساعت طلایی", mood:"گرم · لوکس · غروب", mode:"DARK",
    bg:"#120C08", surface:"#1C130C", primary:"#F5A524", secondary:"#FF7A45", accent:"#FFD166", text:"#FFF6E9", muted:"#B0987A",
    halo:"rgba(245,165,36,.5), rgba(255,122,69,.28)",
    note:"گلوی خورشید: نور طلایی نرم از بالای صفحه، درخشش کهربایی روی پلی" },
  { name:"Emerald Velvet", fa:"مخمل زمردی", mood:"جز · لانژ · کلاسیک", mode:"DARK",
    bg:"#04120E", surface:"#0A1F19", primary:"#10B981", secondary:"#D4AF37", accent:"#34D399", text:"#EFFFF8", muted:"#7FA393",
    halo:"rgba(16,185,129,.45), rgba(212,175,55,.3)",
    note:"مخمل: هاله‌ی زمردی مات با حاشیه‌ی طلایی مثل جلد آلبوم قدیمی" },
  { name:"Rose Quartz", fa:"رز کوارتز", mood:"رمانتیک · نرم · دخترانه", mode:"DARK",
    bg:"#160A12", surface:"#241020", primary:"#FF6FA5", secondary:"#C084FC", accent:"#FFD1E3", text:"#FFF0F6", muted:"#B08AA0",
    halo:"rgba(255,111,165,.5), rgba(192,132,252,.3)",
    note:"هاله‌ی مرواریدی: درخشش صورتی↔یاسی با بافت نرم ابری" },
  { name:"Obsidian Ember", fa:"اخگر ابسیدین", mood:"قدرتمند · دراماتیک · شب", mode:"DARK",
    bg:"#0A0908", surface:"#151210", primary:"#FF5A1F", secondary:"#FFB020", accent:"#FF3D71", text:"#FFF3EA", muted:"#A08A7C",
    halo:"rgba(255,90,31,.5), rgba(255,176,32,.25)",
    note:"اخگر: پالس آرام نارنجی-قرمز مثل زغال نیمه‌سوزان" },
  { name:"Sapphire Deep", fa:"یاقوت آبی", mood:"مینیمال · پرمیوم · آرام", mode:"DARK",
    bg:"#050D1A", surface:"#0B1B30", primary:"#3B82F6", secondary:"#7DD3FC", accent:"#A5B4FC", text:"#EAF4FF", muted:"#7E93B0",
    halo:"rgba(59,130,246,.45), rgba(125,211,252,.28)",
    note:"رینگ یخی: هاله‌ی آبی شفاف و لبه‌ی نور سرد دور نوار پلیر" },
  { name:"Lavender Haze", fa:"غبار اسطوخودوس", mood:"رؤیایی · لطیف · مدرن", mode:"DARK",
    bg:"#0D0A1A", surface:"#171233", primary:"#A78BFA", secondary:"#F0ABFC", accent:"#C4B5FD", text:"#F6F2FF", muted:"#9590B8",
    halo:"rgba(167,139,250,.5), rgba(240,171,252,.28)",
    note:"غبار بنفش: مه رنگی محو که با اسکرول آرام جابه‌جا می‌شود" },
  { name:"Desert Dusk", fa:"غروب کویر", mood:"گرمی خاکی · اصیل · ایرانی", mode:"DARK",
    bg:"#140F0B", surface:"#1F1712", primary:"#E2725B", secondary:"#D9A066", accent:"#9B6B9E", text:"#FDF1E7", muted:"#A89585",
    halo:"rgba(226,114,91,.45), rgba(155,107,158,.22)",
    note:"هاله‌ی تپه‌های شنی: گرادیان خاکی با غبار بنفش غروب" },
  { name:"Cyber Lime", fa:"لایم سایبری", mood:"جسور · ورزشی · آینده", mode:"DARK",
    bg:"#060806", surface:"#0D140D", primary:"#C6F432", secondary:"#22C55E", accent:"#A3E635", text:"#F4FFE9", muted:"#8FA383",
    halo:"rgba(198,244,50,.4), rgba(34,197,94,.25)",
    note:"نئون لایم: هاله‌ی اسیدی با پالس سریع‌تر و کانتور تیز" },
  { name:"Porcelain Light", fa:"پرسلان روشن", mood:"روشن · تمیز · مجله‌ای", mode:"LIGHT",
    bg:"#F6F4EF", surface:"#FFFFFF", primary:"#E85D4A", secondary:"#1F2937", accent:"#F2B84B", text:"#17181A", muted:"#7A7F8C",
    halo:"rgba(232,93,74,.25), rgba(242,184,75,.18)",
    note:"سایه‌ی کاغذی: هاله‌ی مرجانی خیلی نرم زیر کاور، بدون تاریکی" },
  { name:"Cotton Candy", fa:"آب‌نباتی", mood:"شاد · پاپ · جوان", mode:"LIGHT",
    bg:"#FDF4FA", surface:"#FFFFFF", primary:"#EC4899", secondary:"#8B5CF6", accent:"#38BDF8", text:"#221527", muted:"#8A7A87",
    halo:"rgba(236,72,153,.28), rgba(139,92,246,.2), rgba(56,189,248,.18)",
    note:"حباب رنگی: سه هاله‌ی پاستلی که آرام نفس می‌کشند" },
];

const grid = document.getElementById("grid");
for (const t of themes) {
  const card = document.createElement("div");
  card.className = "card";
  card.style.background = `linear-gradient(160deg, ${t.surface}, ${t.bg} 70%)`;
  card.style.color = t.text;
  const iconBg = `linear-gradient(135deg, ${t.primary}, ${t.secondary})`;
  card.innerHTML = `
    <div class="halo-bg" style="background: radial-gradient(closest-side, ${t.halo.split(", ")[0]}, transparent 70%)"></div>
    <div class="head">
      <div>
        <div class="name">${t.name} <span style="opacity:.45;font-weight:400;font-size:13px">· ${t.fa}</span></div>
        <div class="mood">${t.mood}</div>
      </div>
      <div class="badge">${t.mode}</div>
    </div>
    <div class="app" style="background:${t.surface}99;border:1px solid rgba(255,255,255,.09);box-shadow:0 18px 40px -18px ${t.bg}">
      <div class="art" style="background:${iconBg};color:#0b0b12;box-shadow:0 0 28px -4px ${t.halo.split(", ")[0]}">M</div>
      <div class="meta">
        <div class="t1">Yakh Zadam</div>
        <div class="t2">Shadmehr Aghili · 3:25</div>
        <div class="bar" style="background:rgba(255,255,255,.12)"><i style="background:linear-gradient(90deg,${t.primary},${t.secondary})"></i></div>
      </div>
      <div class="play" style="background:${iconBg};color:#0b0b12">
        <svg viewBox="0 0 24 24" fill="currentColor"><polygon points="6 3 20 12 6 21 6 3"/></svg>
      </div>
    </div>
    <div class="swatches">
      ${[["BG",t.bg],["Surface",t.surface],["Primary",t.primary],["Secondary",t.secondary],["Accent",t.accent],["Text",t.text]].map(([n,c])=>`
        <div class="sw"><i style="background:${c};box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)"></i><span>${n}</span></div>`).join("")}
    </div>
    <div class="halo-note"><span class="dot" style="background:${t.primary};box-shadow:0 0 10px ${t.primary}"></span>${t.note}</div>
  `;
  grid.appendChild(card);
}
</script>
</body>
</html>
