<!doctype html>
<html lang="en" dir="ltr" data-theme="dark">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MELUNE â€” Offline</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        background: #0a0a0f;
        color: #fff;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        text-align: center;
      }
      .wrap { max-width: 22rem; }
      .mark {
        width: 64px;
        height: 64px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 5px;
      }
      .mark span { width: 6px; border-radius: 3px; background: #fff; }
      .mark span:nth-child(1) { height: 14px; }
      .mark span:nth-child(2) { height: 24px; }
      .mark span:nth-child(3) { height: 18px; }
      h1 { font-size: 1.25rem; margin: 0 0 8px; }
      p { color: #8a8a9a; font-size: 0.9rem; line-height: 1.5; margin: 0 0 20px; }
      button {
        border: 0;
        border-radius: 12px;
        padding: 10px 20px;
        font-size: 0.9rem;
        font-weight: 500;
        color: #fff;
        background: linear-gradient(135deg, #8b5cf6, #3b82f6);
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="mark" aria-hidden="true"><span></span><span></span><span></span></div>
      <h1>You're offline</h1>
      <p>
        MELUNE needs a connection to stream and browse the catalog. Pages you've
        already opened may still work from where you left off.
      </p>
      <button onclick="location.reload()">Try again</button>
    </div>
  </body>
</html>
